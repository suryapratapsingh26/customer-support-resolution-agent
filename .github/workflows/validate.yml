name: Validate

on:
  push:
  pull_request:

jobs:
  backend-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer_support_migration_test
          POSTGRES_USER: support_test
          POSTGRES_PASSWORD: migration-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_test -d customer_support_migration_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://support_test:migration-test-only-password@localhost:5432/customer_support_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://support_test:migration-test-only-password@localhost:5432/customer_support_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_migrations.py
      - run: python -m pytest -q
      - run: python -m compileall -q app migrations tests scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check built frontend for server credential names
        run: |
          if grep -R -E "BACKEND_SERVICE_API_KEY|AGENT_CUSTOMER_TOKEN_SECRET|APPROVAL_API_KEY|OIDC_CLIENT_SECRET" dist; then
            echo "Server credential variable names found in frontend output"
            exit 1
          fi

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: compose-validation-only
          APP_DB_PASSWORD: compose-app-validation-only
          MIGRATION_DB_PASSWORD: compose-migration-validation-only
      - name: Validate local Keycloak profile configuration
        run: docker compose --env-file .env.example --env-file .env.keycloak.example --profile local-oidc config --quiet
      - name: Build production images
        run: |
          docker build -f Dockerfile -t customer-support-backend:ci .
          docker build -f frontend/Dockerfile -t customer-support-frontend:ci ./frontend
          docker build -f deploy/postgres/Dockerfile -t customer-support-postgres:ci ./deploy/postgres
          docker build -f deploy/keycloak/Dockerfile -t customer-support-keycloak:ci ./deploy/keycloak
