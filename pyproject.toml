[project]
name = "customer-support-resolution-agent"
version = "0.1.0"
description = "An agentic AI system for customer support resolution."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "langgraph",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "alembic",
    "chromadb>=0.5,<2",
    "sentence-transformers>=3,<6",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
